<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - E-Commerce Product Card Fetcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 24px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #product-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .product-card img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 12px;
        }
        .product-card h3 {
            font-size: 15px;
            color: #222;
            height: 40px;
            overflow: hidden;
            margin: 8px 0;
        }
        .product-card .price {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <h1>E-Commerce Product Dashboard (Fake Store API)</h1>
    <div id="product-container">
        <p style="text-align:center;">Loading products...</p>
    </div>

    <script src="q6_product_card_fetcher.js"></script>
</body>
</html>
