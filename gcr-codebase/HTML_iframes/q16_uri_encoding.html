<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 16 - URI Encoding Demonstration</title>
</head>
<body>
    <!-- Question 16: Demonstration of URI encoding with %20 for spaces -->
    <h1>URI Encoding Demonstration</h1>
    <p>
        Original Query: <code>https://example.com/search?query=HTML & CSS</code><br>
        Encoded Query URL: <code>https://example.com/search?query=HTML%20&amp;%20CSS</code>
    </p>

    <!-- Hyperlink with properly percent-encoded spaces (%20) -->
    <p>
        <a href="https://example.com/search?query=HTML%20&amp;%20CSS">Search for HTML &amp; CSS (URI Encoded)</a>
    </p>
</body>
</html>
