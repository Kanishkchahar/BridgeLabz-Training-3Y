<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 9 - File Upload Form</title>
</head>
<body>
    <!-- Question 9: File upload form accepting only .jpg and .png files -->
    <h1>Upload Image File</h1>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="profile_pic">Choose an image file:</label><br><br>
        <!-- File input with accept attribute restricting to .jpg, .jpeg, .png -->
        <input type="file" id="profile_pic" name="profile_pic" accept=".jpg, .jpeg, .png" required><br><br>

        <!-- Short note describing allowed file types -->
        <p><strong>Note:</strong> Only <em>.jpg</em> and <em>.png</em> image formats are allowed for upload.</p>

        <input type="submit" value="Upload File">
    </form>
</body>
</html>
