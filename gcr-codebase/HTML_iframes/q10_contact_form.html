<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 10 - Contact Form</title>
</head>
<body>
    <!-- Question 10: Contact form with placeholder and required attributes -->
    <h1>Contact Us</h1>
    <form action="#" method="post">
        <!-- Full Name -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <!-- Email -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="name@example.com" required><br><br>

        <!-- Subject -->
        <label for="subject">Subject:</label><br>
        <input type="text" id="subject" name="subject" placeholder="Enter subject" required><br><br>

        <!-- Message -->
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message here..." required></textarea><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Send Message">
    </form>
</body>
</html>
