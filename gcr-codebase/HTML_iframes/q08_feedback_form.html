<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 8 - Feedback Form</title>
</head>
<body>
    <!-- Question 8: Feedback form with textarea, rating radio buttons, and submit button -->
    <h1>Feedback Form</h1>
    <form action="#" method="post">
        <!-- Feedback Textarea -->
        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="Write your feedback here..."></textarea><br><br>

        <!-- Rating Radio Buttons -->
        <label>Rating:</label><br>
        <input type="radio" id="good" name="rating" value="Good" required>
        <label for="good">Good</label><br>

        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label><br>

        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
