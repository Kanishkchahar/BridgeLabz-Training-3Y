<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 15 - Payment Form</title>
</head>
<body>
    <!-- Question 15: Payment form with required fields and Pay Now button -->
    <h1>Payment Form</h1>
    <form action="#" method="post">
        <!-- Cardholder Name -->
        <label for="cardholder_name">Cardholder Name:</label><br>
        <input type="text" id="cardholder_name" name="cardholder_name" placeholder="John Doe" required><br><br>

        <!-- Card Number -->
        <label for="card_number">Card Number:</label><br>
        <input type="text" id="card_number" name="card_number" pattern="[0-9]{16}" placeholder="1234567812345678" required><br><br>

        <!-- Expiry Date -->
        <label for="expiry_date">Expiry Date (MM/YY):</label><br>
        <input type="text" id="expiry_date" name="expiry_date" pattern="(0[1-9]|1[0-2])\/[0-9]{2}" placeholder="MM/YY" required><br><br>

        <!-- CVV -->
        <label for="cvv">CVV:</label><br>
        <input type="password" id="cvv" name="cvv" maxlength="4" placeholder="123" required><br><br>

        <!-- Pay Now Button -->
        <input type="submit" value="Pay Now">
    </form>
</body>
</html>
