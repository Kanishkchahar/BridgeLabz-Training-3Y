<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 7 - Login Form with CSRF Token</title>
</head>
<body>
    <!-- Question 7: Login form with fields for username, password, and dummy CSRF token -->
    <h1>Login Form</h1>
    <form action="#" method="post">
        <!-- 
            Purpose of CSRF Token:
            A Cross-Site Request Forgery (CSRF) token is a unique, unpredictable secret value 
            generated by the server and included in form submissions. It validates that the incoming 
            request originated from the authenticated user's actual session on the legitimate site, 
            preventing malicious third-party websites from executing unauthorized actions on behalf of the user.
        -->
        <input type="hidden" name="csrf_token" value="d9f8a3c1e2b4567890abcdef12345678">

        <!-- Username field -->
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <!-- Password field -->
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Login">
    </form>
</body>
</html>
