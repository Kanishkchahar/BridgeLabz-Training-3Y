<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 4 - Frameset Layout</title>
</head>
    <!-- Question 4: Frameset layout using <frameset> and <frame> tags -->
    <frameset rows="20%,80%">
        <!-- Top frame with navigation links -->
        <frame src="top_nav.html" name="topFrame" title="Navigation Bar">
        <!-- Bottom frame displaying welcome message -->
        <frame src="bottom_content.html" name="bottomFrame" title="Main Content">
        <noframes>
            <body>
                <p>Your browser does not support framesets.</p>
            </body>
        </noframes>
    </frameset>
</html>
