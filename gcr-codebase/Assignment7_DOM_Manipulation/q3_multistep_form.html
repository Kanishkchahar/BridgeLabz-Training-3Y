<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3: Multi-Step Form with Validation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f1f5f9;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .form-card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 440px;
        }
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            position: relative;
        }
        .progress-step {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            z-index: 1;
            transition: all 0.3s;
        }
        .progress-step.active {
            background: #2563eb;
            color: #fff;
        }
        .step-panel {
            display: none;
        }
        .step-panel.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #2563eb;
        }
        .error-msg {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
        .btn-row {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-next, .btn-submit {
            background: #2563eb;
            color: #fff;
            margin-left: auto;
        }
        .btn-back {
            background: #e2e8f0;
            color: #475569;
        }
        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
        }
        .summary-item {
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="progress-bar">
        <div class="progress-step active" id="badge-1">1</div>
        <div class="progress-step" id="badge-2">2</div>
        <div class="progress-step" id="badge-3">3</div>
    </div>

    <!-- Step 1: Name -->
    <div class="step-panel active" id="step-1">
        <h3>Step 1: Personal Details</h3>
        <div class="form-group">
            <label for="input-name">Full Name</label>
            <input type="text" id="input-name" placeholder="Enter your full name" />
            <div class="error-msg" id="err-name">Name is required (minimum 2 characters).</div>
        </div>
        <div class="btn-row">
            <button type="button" class="btn-next" id="btn-next-1">Next &rarr;</button>
        </div>
    </div>

    <!-- Step 2: Email -->
    <div class="step-panel" id="step-2">
        <h3>Step 2: Contact Information</h3>
        <div class="form-group">
            <label for="input-email">Email Address</label>
            <input type="email" id="input-email" placeholder="example@domain.com" />
            <div class="error-msg" id="err-email">Please enter a valid email address with '@'.</div>
        </div>
        <div class="btn-row">
            <button type="button" class="btn-back" id="btn-back-2">&larr; Back</button>
            <button type="button" class="btn-next" id="btn-next-2">Next &rarr;</button>
        </div>
    </div>

    <!-- Step 3: Password -->
    <div class="step-panel" id="step-3">
        <h3>Step 3: Security</h3>
        <div class="form-group">
            <label for="input-password">Password</label>
            <input type="password" id="input-password" placeholder="At least 6 characters" />
            <div class="error-msg" id="err-password">Password must be at least 6 characters.</div>
        </div>
        <div class="btn-row">
            <button type="button" class="btn-back" id="btn-back-3">&larr; Back</button>
            <button type="button" class="btn-submit" id="btn-submit">Submit</button>
        </div>
    </div>

    <!-- Final Summary -->
    <div class="step-panel" id="step-summary">
        <h3 style="color: #16a34a;">Form Completed!</h3>
        <p style="color: #64748b; font-size: 14px;">Here is your submission summary:</p>
        <div class="summary-card">
            <div class="summary-item"><strong>Name:</strong> <span id="summary-name"></span></div>
            <div class="summary-item"><strong>Email:</strong> <span id="summary-email"></span></div>
            <div class="summary-item"><strong>Password:</strong> <span id="summary-password"></span></div>
        </div>
        <div class="btn-row">
            <button type="button" class="btn-back" id="btn-restart" style="margin: 16px auto 0;">Restart Form</button>
        </div>
    </div>
</div>

<script src="q3_multistep_form.js"></script>
</body>
</html>
