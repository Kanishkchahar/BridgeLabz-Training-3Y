<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4: Theme Switcher Using Attribute Manipulation</title>
    <style>
        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* 1. Light Theme */
        body.theme-light {
            background-color: #f8fafc;
            color: #0f172a;
        }
        body.theme-light .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        /* 2. Dark Theme */
        body.theme-dark {
            background-color: #0f172a;
            color: #f8fafc;
        }
        body.theme-dark .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
        }

        /* 3. Blue Theme */
        body.theme-blue {
            background-color: #1e3a8a;
            color: #f0fdf4;
        }
        body.theme-blue .card {
            background-color: #172554;
            border: 1px solid #3b82f6;
            box-shadow: 0 4px 25px rgba(30, 58, 138, 0.5);
        }

        .card {
            padding: 32px;
            border-radius: 14px;
            text-align: center;
            width: 100%;
            max-width: 440px;
            transition: all 0.3s ease;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }

        .theme-btn {
            padding: 10px 18px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.15s ease;
        }
        .theme-btn:hover {
            transform: translateY(-2px);
        }

        .btn-light-theme {
            background: #e2e8f0;
            color: #1e293b;
        }
        .btn-dark-theme {
            background: #334155;
            color: #f8fafc;
        }
        .btn-blue-theme {
            background: #2563eb;
            color: #ffffff;
        }

        .theme-status {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.85;
        }
    </style>
</head>
<body class="theme-light" data-theme="light">

<div class="card">
    <h2>Theme Switcher</h2>
    <p>Switch between Light, Dark, and Blue color schemes dynamically using attribute manipulation.</p>

    <div class="btn-group">
        <button class="theme-btn btn-light-theme" data-target-theme="light">Light</button>
        <button class="theme-btn btn-dark-theme" data-target-theme="dark">Dark</button>
        <button class="theme-btn btn-blue-theme" data-target-theme="blue">Blue</button>
    </div>

    <div class="theme-status" id="theme-status">
        Active theme: <strong>light</strong> | Attribute: <code>data-theme="light"</code>
    </div>
</div>

<script src="q4_theme_switcher.js"></script>
</body>
</html>
