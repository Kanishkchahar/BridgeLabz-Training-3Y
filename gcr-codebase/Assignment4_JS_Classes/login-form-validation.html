<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Q7: Login Form Validation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #eef2f7;
    }
    .login-container {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 9px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
    .alert {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      display: none;
      font-size: 0.9rem;
    }
    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .alert ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Account Login</h2>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="usernameInput">Username (min 5 chars)</label>
        <input type="text" id="usernameInput" placeholder="Enter username">
      </div>

      <div class="field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="Enter password">
      </div>

      <button type="submit">Log In</button>

      <div id="loginFeedback"></div>
    </form>
  </div>

  <script src="login-form-validation.js"></script>
</body>
</html>
